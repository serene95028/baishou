<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外公的百壽圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="aframe.min.js"></script>
<script>window.AFRAME||document.write('<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"><\/script>')</script>
<script src="mindar.js"></script>
<script>(window.MINDAR&&window.MINDAR.IMAGE)||document.write('<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>')</script>
<script>
/* ============================================================
   錄音設定：想改顯示的名字，只要改下面引號裡的字
   錄音檔和 index.html 放在同一層，檔名用兩位數號碼：
   01.mp3、02.m4a…（mp3、m4a、wav 都可以）
   ============================================================ */
const BLESSINGS = [
  { no: 1,  name: "貝貝" },
  { no: 2,  name: "嘉嘉" },
  { no: 3,  name: "歡呼聲" },
  { no: 4,  name: "祝福語" },
  { no: 5,  name: "寶寶" },
  { no: 6,  name: "妹妹" },
  { no: 7,  name: "小美" },
  { no: 8,  name: "小華" },
  { no: 9,  name: "億文" },
  { no: 10, name: "祝福語" },
  { no: 11, name: "姨公" },
  { no: 12, name: "Alice" },
  { no: 13, name: "Zara" },
  { no: 14, name: "Fenny" },
  { no: 15, name: "舅媽" },
  { no: 16, name: "張弘傑" },
  { no: 17, name: "爸爸" },
  { no: 18, name: "Bee" },
  { no: 19, name: "祝福語" },
  { no: 20, name: "全家人" }
];
</script>
<style>
:root{
  --ink:#2a0d2c;
  --ink-2:#3b1640;
  --paper:#f7efe0;
  --paper-dim:#d9c9b4;
  --seal-red:#d6231f;
  --seal-rose:#c4167c;
  --seal-orange:#ee7a12;
  --seal-violet:#8a1ba6;
  --gold:#f2c66b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{display:none;min-height:100%}
.screen.on{display:block}

/* ---------- 首頁 ---------- */
#home{padding:28px 20px 40px;max-width:640px;margin:0 auto;text-align:center}
.art{position:relative;margin:4px auto 30px;padding:10px;background:var(--paper);
  border-radius:4px;transform:rotate(-1.2deg);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.art img{display:block;width:100%;height:auto}
h1{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:.12em;margin:0 0 10px;line-height:1.25}
.sub{font-size:20px;line-height:1.7;color:var(--paper-dim);margin:0 0 32px}
.big{display:block;width:100%;border:0;border-radius:18px;padding:22px 18px;margin:0 0 16px;
  font-size:24px;font-weight:700;letter-spacing:.08em;line-height:1.4}
.big small{display:block;font-size:16px;font-weight:500;letter-spacing:0;opacity:.85;margin-top:4px}
.big.ar{background:var(--seal-red);color:#fff;box-shadow:0 6px 0 #8e1210}
.big.flat{background:var(--paper);color:var(--ink);box-shadow:0 6px 0 var(--paper-dim)}
.big:active{transform:translateY(4px);box-shadow:none}
.hint{font-size:16px;line-height:1.7;color:var(--paper-dim);margin-top:18px}

/* ---------- 頂部列 ---------- */
.bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;pointer-events:none}
.bar button{pointer-events:auto;border:0;border-radius:999px;padding:12px 20px;font-size:19px;font-weight:700;
  background:rgba(42,13,44,.82);color:var(--paper);backdrop-filter:blur(6px)}
.bar button.frozen{background:var(--gold);color:var(--ink)}

/* ---------- AR ---------- */
#ar{position:fixed;inset:0;background:#000;overflow:hidden}
#arwrap{position:absolute;inset:0;overflow:hidden}
#arwrap a-scene{position:absolute;inset:0}
.guide{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:15;
  text-align:center;font-size:21px;font-weight:700;line-height:1.5;padding:16px;border-radius:16px;
  background:rgba(42,13,44,.82);backdrop-filter:blur(6px)}
.frame-guide{position:fixed;z-index:12;left:8%;right:8%;top:28%;aspect-ratio:1.44/1;border:3px dashed rgba(247,239,224,.7);
  border-radius:10px;pointer-events:none}

/* ---------- 直接點選 ---------- */
#flat{padding:calc(env(safe-area-inset-top,0px) + 76px) 10px 40px}
#flat h2{font-size:24px;text-align:center;margin:0 0 16px;font-weight:700;letter-spacing:.08em}
.board{position:relative;max-width:900px;margin:0 auto;background:var(--paper);padding:0;border-radius:4px}
.board img{display:block;width:100%;height:auto;border-radius:4px}
.spot{position:absolute;border:0;background:transparent;padding:0;border-radius:6px;transition:transform .25s, box-shadow .25s}
.spot.lit{transform:scale(1.12);box-shadow:0 0 0 4px var(--gold),0 10px 30px rgba(0,0,0,.5);z-index:2}
.spot.lit::after{content:"";position:absolute;inset:0;border-radius:6px;background:rgba(242,198,107,.18)}

/* ---------- 祝福卡 ---------- */
#card{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;
  background:rgba(20,6,22,.55);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#card.on{display:flex}
.sheet{width:100%;max-width:460px;background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 22px 18px;
  animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:16px}
.seal{flex:none;width:86px;height:86px;border-radius:8px;background-size:cover;background-position:center;
  box-shadow:0 4px 0 rgba(0,0,0,.18)}
.who p{margin:0;font-size:17px;color:#6b4c62}
.who h3{margin:2px 0 0;font-size:34px;font-weight:900;line-height:1.2}
.status{display:flex;align-items:center;gap:10px;margin:18px 0 16px;font-size:20px;font-weight:700;min-height:30px}
.wave{display:flex;gap:4px;align-items:flex-end;height:24px}
.wave i{display:block;width:5px;background:var(--seal-red);border-radius:3px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
.status.idle .wave{display:none}
.row{display:flex;gap:12px}
.row button{flex:1;border:0;border-radius:14px;padding:16px 10px;font-size:21px;font-weight:700}
.again{background:var(--seal-red);color:#fff}
.close{background:#e8dcc8;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="home" class="screen on">
  <div class="art"><img src="baishou.jpg" alt="百壽圖：二十個不同字體的壽字印章"></div>
  <h1>外公，生日快樂</h1>
  <p class="sub">這二十個壽字裡，<br>藏著全家人想對您說的話。</p>
  <button class="big ar" id="goAR">對著百壽圖看<small>壽字會從畫上浮起來</small></button>
  <button class="big flat" id="goFlat">直接點壽字聽<small>畫不在身邊時用這個</small></button>
  <p class="hint">第一次使用時，手機會問能不能用相機，請按「允許」。</p>
</section>

<!-- AR 模式 -->
<section id="ar" class="screen">
  <div class="bar">
    <button id="arBack">返回</button>
    <button id="freeze">定住畫面</button>
  </div>
  <div id="arwrap"></div>
  <div class="frame-guide" id="frameGuide"></div>
  <div class="guide" id="guide">把手機對準整張百壽圖</div>
</section>

<!-- 直接點選 -->
<section id="flat" class="screen">
  <div class="bar"><button id="flatBack">返回</button><span></span></div>
  <h2>點一個壽字，聽聽是誰的祝福</h2>
  <div class="board" id="board"><img src="baishou.jpg" alt="百壽圖"></div>
</section>

<!-- 祝福卡 -->
<div id="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="sheet">
    <div class="who">
      <div class="seal" id="cardSeal"></div>
      <div><p id="cardNo"></p><h3 id="cardName"></h3></div>
    </div>
    <div class="status" id="status"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="statusText"></span></div>
    <div class="row">
      <button class="again" id="again">再聽一次</button>
      <button class="close" id="close">關閉</button>
    </div>
  </div>
</div>

<script>
// 每個壽字在畫上的位置（佔整張圖的百分比：左、上、寬、高）
const SPOTS=[[9.03,2.6,15.5,22.64],[25.89,2.6,15.42,22.64],[42.31,2.6,15.56,22.64],[58.42,2.6,16.06,22.64],[75.25,2.6,15.64,22.64],[9.03,26.88,15.5,22.32],[25.89,26.88,15.42,22.32],[42.31,26.88,15.56,22.32],[58.42,26.88,16.06,22.32],[75.25,26.88,15.64,22.32],[9.03,50.44,15.5,22.52],[25.89,50.44,15.42,22.52],[42.31,50.44,15.56,22.52],[58.42,50.44,16.06,22.52],[75.25,50.44,15.64,22.52],[9.03,74.68,15.5,22.48],[25.89,74.68,15.42,22.48],[42.31,74.68,15.56,22.48],[58.42,74.68,16.06,22.48],[75.25,74.68,15.64,22.48]];
const ASPECT=1250/1800; // 圖高 / 圖寬
const pad=n=>String(n).padStart(2,"0");
const $=id=>document.getElementById(id);

/* ---------- 聲音 ---------- */
const player=new Audio(); player.preload="auto"; player.setAttribute("playsinline","");
let current=null, onEndCb=null;
const FOUND={};
let scanDone=false;
(async function scanAudio(){ // 開網頁時先找好每個號碼的錄音檔
  const exts=["mp3","m4a","wav","aac"];
  await Promise.all(BLESSINGS.map(async b=>{
    for(const e of exts){
      const url=pad(b.no)+"."+e;
      try{ const r=await fetch(url,{method:"HEAD",cache:"no-store"}); if(r.ok){ FOUND[b.no]=url; return; } }catch(err){}
    }
  }));
  scanDone=true;
})();
function unlockAudio(){ // 第一次按按鈕時解鎖手機的聲音
  try{
    player.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    const p=player.play(); if(p) p.catch(()=>{});
  }catch(e){}
}
function playNo(no){
  const url=FOUND[no];
  if(!url){
    if(scanDone){ setStatus("missing"); return; }
    setStatus("loading");
    setTimeout(()=>{ if(current===no) setStatus(FOUND[no]?"tap":"missing"); },2500);
    return;
  }
  player.onended=()=>{ setStatus("done"); onEndCb&&onEndCb(); };
  player.onerror=()=>setStatus("broken");
  player.src=url;
  setStatus("loading");
  const p=player.play();
  if(p) p.then(()=>setStatus("playing")).catch(e=>setStatus(e.name==="NotAllowedError"?"tap":"broken"));
}
function setStatus(s){
  const st=$("status"), t=$("statusText");
  st.classList.toggle("idle", s!=="playing");
  t.textContent={loading:"準備播放…",playing:"正在播放",done:"播放完畢",missing:"這段錄音還沒放進來",tap:"請按「再聽一次」",broken:"這段錄音打不開，請換成 m4a 或 mp3 檔"}[s]||"";
}

/* ---------- 祝福卡 ---------- */
function openCard(no, endCb){
  const b=BLESSINGS.find(x=>x.no===no)||{name:""};
  current=no; onEndCb=null;
  $("cardSeal").style.backgroundImage="url("+pad(no)+".jpg)";
  $("cardNo").textContent="第 "+no+" 個壽字";
  $("cardName").textContent=b.name;
  $("card").classList.add("on");
  playNo(no); onEndCb=endCb||null;
}
function closeCard(){
  $("card").classList.remove("on"); player.pause();
  document.querySelectorAll(".spot.lit").forEach(x=>x.classList.remove("lit"));
  resetTiles();
  current=null;
}
$("again").onclick=()=>{ if(current) playNo(current); };
$("close").onclick=closeCard;
$("card").addEventListener("click",e=>{ if(e.target.id==="card") closeCard(); });

/* ---------- 畫面切換 ---------- */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }

/* ---------- 直接點選 ---------- */
const board=$("board");
SPOTS.forEach((p,i)=>{
  const b=document.createElement("button"); b.className="spot";
  b.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%`;
  b.setAttribute("aria-label","第 "+(i+1)+" 個壽字："+(BLESSINGS[i]?.name||""));
  b.onclick=()=>{ document.querySelectorAll(".spot.lit").forEach(x=>x.classList.remove("lit")); b.classList.add("lit"); openCard(i+1); };
  board.appendChild(b);
});
$("goFlat").onclick=()=>{ unlockAudio(); show("flat"); };
$("flatBack").onclick=()=>{ closeCard(); show("home"); };

/* ---------- AR ---------- */
const AR_READY=!!(window.AFRAME && AFRAME.components && AFRAME.components["mindar-image"]);
$("goAR").onclick=()=>{
  unlockAudio();
  if(!AR_READY){ alert("AR 程式沒有載入成功，請檢查 aframe.min.js 和 mindar.js 有沒有上傳，或先用「直接點壽字聽」。"); return; }
  try{ startAR(); }catch(e){ show("ar"); $("guide").textContent="AR 啟動失敗："+e.message; }
};
let sceneEl=null, arSys=null, found=false, frozen=false, risen=false;
if(AR_READY) AFRAME.registerComponent("shou-tile",{
  schema:{no:{type:"int"}},
  init(){
    this.el.addEventListener("click",()=>{
      if(!found && !frozen) return;
      resetTiles();
      const el=this.el;
      el.setAttribute("animation__pick",{property:"position",to:posOf(this.data.no-1,0.14),dur:350,easing:"easeOutBack"});
      el.setAttribute("animation__big",{property:"scale",to:"1.3 1.3 1",dur:350,easing:"easeOutBack"});
      openCard(this.data.no);
    });
  }
});
function posOf(i,z){
  const p=SPOTS[i]; const cx=(p[0]+p[2]/2)/100, cy=(p[1]+p[3]/2)/100;
  return `${(cx-0.5).toFixed(4)} ${((0.5-cy)*ASPECT).toFixed(4)} ${z}`;
}
function resetTiles(){
  if(!sceneEl) return;
  sceneEl.querySelectorAll("[shou-tile]").forEach((el,i)=>{
    el.setAttribute("animation__pick",{property:"position",to:posOf(i,risen?0.035:0.001),dur:300});
    el.setAttribute("animation__big",{property:"scale",to:"1 1 1",dur:300});
  });
}
function riseAll(){
  if(risen) return; risen=true;
  sceneEl.querySelectorAll("[shou-tile]").forEach((el,i)=>{
    el.setAttribute("animation__rise",{property:"position",from:posOf(i,0.001),to:posOf(i,0.035),dur:600,delay:i*90,easing:"easeOutBack"});
    el.setAttribute("animation__fade",{property:"material.opacity",from:0,to:1,dur:400,delay:i*90});
  });
}
function buildScene(){
  const w=$("arwrap");
  const tiles=SPOTS.map((p,i)=>{
    const tw=(p[2]/100).toFixed(4), th=((p[3]/100)*ASPECT).toFixed(4);
    return `<a-plane class="clickable" shou-tile="no:${i+1}" position="${posOf(i,0.001)}" width="${tw}" height="${th}"
      material="src:#t${i+1}; transparent:true; opacity:0; shader:flat"></a-plane>`;
  }).join("");
  const assets=SPOTS.map((_,i)=>`<img id="t${i+1}" src="${pad(i+1)}.jpg">`).join("");
  w.innerHTML=`<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
      color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>${assets}</a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>
    <a-entity id="anchor" mindar-image-target="targetIndex: 0">${tiles}</a-entity>
  </a-scene>`;
  sceneEl=w.querySelector("a-scene");
  const anchor=sceneEl.querySelector("#anchor");
  anchor.addEventListener("targetFound",()=>{ found=true; $("frameGuide").style.display="none"; $("guide").textContent="點一個壽字，聽聽是誰的祝福"; riseAll(); });
  anchor.addEventListener("targetLost",()=>{ found=false; if(!frozen){ $("guide").textContent="把手機對準整張百壽圖"; } });
  sceneEl.addEventListener("arError",()=>{ $("guide").textContent="相機打不開。請改用「直接點壽字聽」，或用 Safari／Chrome 開啟這個網址。"; });
}
function startAR(){
  show("ar"); found=false; frozen=false; risen=false;
  $("freeze").classList.remove("frozen"); $("freeze").textContent="定住畫面";
  $("frameGuide").style.display="block"; $("guide").textContent="開啟相機中…";
  buildScene();
  const go=()=>{ arSys=sceneEl.systems["mindar-image-system"]; arSys.start(); $("guide").textContent="把手機對準整張百壽圖"; };
  sceneEl.hasLoaded?go():sceneEl.addEventListener("loaded",go);
}
function stopAR(){
  closeCard();
  try{ arSys&&arSys.stop(); }catch(e){}
  arSys=null; sceneEl=null; $("arwrap").innerHTML="";
}
$("arBack").onclick=()=>{ stopAR(); show("home"); };
$("freeze").onclick=()=>{
  if(!arSys) return;
  frozen=!frozen;
  if(frozen){ arSys.pause(); $("freeze").textContent="恢復鏡頭"; $("freeze").classList.add("frozen"); $("guide").textContent="畫面已定住，可以放心慢慢點"; }
  else{ arSys.unpause(); $("freeze").textContent="定住畫面"; $("freeze").classList.remove("frozen"); $("guide").textContent=found?"點一個壽字，聽聽是誰的祝福":"把手機對準整張百壽圖"; }
};
</script>
</body>
</html>
