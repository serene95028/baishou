<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外公的百壽圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="aframe.min.js"></script>

<script>
/* ============================================================

   錄音檔和 index.html 放在同一層，檔名用兩位數號碼：
   01.mp3、02.m4a…（mp3、m4a、wav 都可以）
   要放外公的話的那一號，在那一行加上  special: true
   ============================================================ */
const BLESSINGS = [
  { no: 1,  name: "貝貝" },
  { no: 2,  name: "嘉嘉" },
  { no: 3,  name: "歡呼聲" },
  { no: 4,  name: "祝福語" },
  { no: 5,  name: "寶寶" },
  { no: 6,  name: "妹妹" },
  { no: 7,  name: "小美" },
  { no: 8,  name: "小華" },
  { no: 9,  name: "小憶文" },
  { no: 10, name: "祝福語" },
  { no: 11, name: "志超" },
  { no: 12, name: "蓓蓓" },
  { no: 13, name: "小灰" },
  { no: 14, name: "Fenny" },
  { no: 15, name: "吟秋" },
  { no: 16, name: "張弘傑" },
  { no: 17, name: "張樞" },
  { no: 18, name: "Bee" },
  { no: 19, name: "祝福語" },
  { no: 20, name: "全體祝福" }
];
const CANDLE_FINALE = 20;   // 吹完蠟燭後要播放的號碼

/* 日記本上的文字：直接改引號裡的字就好（\n 代表換行） */
const BOOK = {
  coverNumber: "100",
  coverTitle:  "外公\n生日快樂",
  coverCorner: [],
  coverFoot:   "10/6/2026",
  page1Title:  "那一天",
  page1Date:   "2026.10",
  endTop:      "敬祝",
  endVerse:    "福如東海\n壽比南山",
  endSign:     "愛您的 全家人"
};
/* 照片：封面請命名 cover.jpg；當天照片命名 photo1.jpg、photo2.jpg…（最多 12 張） */
</script>
<style>
@font-face{font-family:"ShouHand";src:url("shouhand.woff2") format("woff2");font-display:swap}
:root{
  --ink:#3a0b12; --paper:#f1ede7; --paper-dim:#d8cdc2;
  --seal-red:#b3202a; --red:#b3202a; --wine:#7a1824; --rose:#c46a6a; --text:#2b1b1b;
  --gold:#e8c27a; --gold-deep:#a8823a;
  --hand:"ShouHand","Noto Serif TC","Songti TC",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;font-family:var(--hand);-webkit-text-stroke:.5px currentColor}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{display:none;min-height:100%}
.screen.on{display:block}

/* 頂部列 */
.bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;gap:8px;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;pointer-events:none}
.bar button{pointer-events:auto;border:0;border-radius:999px;padding:10px 18px;font-size:30px;font-weight:400;
  background:rgba(42,13,44,.82);color:var(--paper);backdrop-filter:blur(6px);white-space:nowrap}
.bar .right{display:flex;gap:8px}
.bar button.frozen{background:var(--gold);color:var(--ink)}
.bar button[hidden]{display:none}

/* AR / 漂浮 */
#ar{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#arwrap{position:absolute;inset:0;overflow:hidden}
#arwrap video.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#arwrap a-scene{position:absolute;inset:0;z-index:1}
.guide{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;
  text-align:center;padding:14px;border-radius:18px;background:rgba(42,13,44,.84);backdrop-filter:blur(6px)}
.guide p{margin:0 0 12px;font-size:25px;font-weight:700;line-height:1.45}
.gbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.skipBtn{border:0;border-radius:14px;padding:10px 18px;font-size:30px;font-weight:400;background:rgba(247,239,224,.18);color:var(--paper)}
.skipBtn[hidden]{display:none}
.candleBtn{border:0;border-radius:14px;padding:10px 24px;font-size:32px;font-weight:400;background:var(--gold);color:var(--ink)}
.frame-guide{position:fixed;z-index:12;left:8%;right:8%;top:24%;aspect-ratio:1.44/1;border:3px dashed rgba(247,239,224,.7);border-radius:10px;pointer-events:none}

/* ================= 日記本 ================= */
#book{min-height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 0 calc(env(safe-area-inset-bottom,0px) + 18px);
  background:radial-gradient(120% 90% at 50% 30%,#5a121b 0%,#3b0a11 55%,#24060a 100%)}
#book.on{display:flex}
.stage{perspective:2200px;width:min(92vw,470px);margin-bottom:30px}
.book{position:relative;width:100%;aspect-ratio:1/1.42;max-height:calc(100svh - 120px);margin:0 auto;transform-style:preserve-3d}
.book::before{content:"";position:absolute;inset:6px -6px -8px 6px;border-radius:4px 10px 10px 4px;background:#d9d1c6;
  box-shadow:0 30px 60px rgba(0,0,0,.45);transform:translateZ(-2px)}
.ribbon{position:absolute;bottom:-46px;right:20%;width:14px;height:70px;background:var(--wine);z-index:-1;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.page,.cover{position:absolute;inset:0;border-radius:3px 8px 8px 3px;background:var(--paper);color:var(--text);
  transform-origin:left center;transition:transform .9s cubic-bezier(.45,.05,.25,1),box-shadow .9s;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page{overflow-y:auto;padding:26px 24px 22px 30px;
  background:linear-gradient(90deg,rgba(80,30,30,.10) 0,rgba(80,30,30,0) 22px),var(--paper)}
.page.turned,.cover.turned{transform:rotateY(-178deg);pointer-events:none}
.page.gone,.cover.gone{visibility:hidden}

/* 封面 */
.cover{z-index:50;cursor:pointer;overflow:hidden;background:var(--paper);box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.25)}
.cv-corner{position:absolute;top:6%;right:9%;text-align:right;font-family:"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;
  font-size:clamp(11px,3.2vw,15px);letter-spacing:.06em;color:var(--text);line-height:1.35}
.cv-script{position:absolute;left:7%;top:3%;font-family:var(--hand);color:var(--red);-webkit-text-stroke:2px var(--red);
  font-size:clamp(120px,38vw,190px);line-height:.9;transform:rotate(-7deg);white-space:nowrap;z-index:3;letter-spacing:.02em}
.cv-frame{position:absolute;left:50%;top:47%;width:48%;aspect-ratio:100/122;transform:translate(-50%,-50%)}
.cv-frame svg.scallop{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cv-photo{position:absolute;inset:11% 10%;background:#e2d8cf center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--rose);font-size:14px;line-height:1.6}
.cv-photo.has{color:transparent}
.cv-hat{position:absolute;top:-7%;right:14%;width:21%;transform:rotate(9deg);z-index:2}
.cv-zh{position:absolute;right:8%;bottom:7%;color:var(--red);font-family:var(--hand);-webkit-text-stroke:.7px var(--red);font-size:clamp(38px,12vw,58px);letter-spacing:.06em;line-height:1.15;text-align:right;white-space:nowrap;transform:rotate(-3deg)}
.cv-foot{position:absolute;left:9%;bottom:5%;font-family:"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;font-size:clamp(14px,4.2vw,18px);
  letter-spacing:.12em;color:var(--text)}
.cover-in{position:absolute;inset:0;border-radius:3px 8px 8px 3px;background:var(--wine);transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;color:#f3d9d4;font-size:18px;letter-spacing:.3em}

/* 內頁共用 */
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(122,24,36,.25);padding-bottom:8px;margin-bottom:14px}
.ph h2{margin:0;color:var(--red);font-family:var(--hand);-webkit-text-stroke:.6px var(--red);font-weight:400;font-size:clamp(32px,10vw,42px);letter-spacing:.04em}
.ph .script{font-size:clamp(36px,11vw,48px);letter-spacing:.1em;line-height:1.1}
.ph .kicker{font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;letter-spacing:.2em;color:var(--rose);white-space:nowrap}
.pnote{font-size:20px;color:#5a3a3a;line-height:1.5;margin:10px 0 0;text-align:center;font-weight:700}

/* ================= 貼紙 ================= */
.stk{position:absolute;pointer-events:none;z-index:5;height:auto;filter:drop-shadow(0 2px 3px rgba(60,10,15,.28))}
.ph-hd-stk{position:relative;width:52px;margin-left:auto;margin-right:8px;align-self:center;top:2px}
/* 照片拼貼 */
.collage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph-item{position:relative;margin:0;padding:6px 6px 6px;background:#fff;box-shadow:0 3px 10px rgba(60,10,15,.18);border:0;cursor:zoom-in}
.ph-item:nth-child(odd){transform:rotate(-1.2deg)} .ph-item:nth-child(even){transform:rotate(1deg)}
.ph-item:first-child{grid-column:1/-1;transform:rotate(-.6deg)}
.ph-item .img{aspect-ratio:3/4;background:#eadfd6 center/cover no-repeat}
.ph-item:first-child .img{aspect-ratio:3/2}
.ph-item:nth-child(4n) .img{aspect-ratio:1/1}
.ph-item.empty{cursor:default;box-shadow:none;background:transparent;border:1.5px dashed rgba(179,32,42,.35)}
.ph-item.empty .img{background:transparent;display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:13px;text-align:center;line-height:1.6}

/* 百壽圖頁 */
.board{position:relative;margin:4px 0 0;background:#fff;padding:0;box-shadow:0 4px 14px rgba(60,10,15,.2)}
.board img{display:block;width:100%;height:auto}
.spot{position:absolute;border:0;background:transparent;padding:0;border-radius:4px;transition:transform .25s, box-shadow .25s}
.spot.lit{transform:scale(1.12);box-shadow:0 0 0 3px var(--red),0 10px 24px rgba(0,0,0,.35);z-index:2}
.board.dim .spot{background:rgba(40,6,10,.62);transition:background .4s, box-shadow .4s}
.board.dim .spot.glow{background:transparent;box-shadow:0 0 0 3px var(--gold),0 0 16px 3px rgba(232,194,122,.8);z-index:2}
.pactions{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pbtn{flex:1;border:1.5px solid var(--red);background:transparent;color:var(--red);border-radius:999px;padding:8px 6px;font-size:32px;font-weight:400;letter-spacing:.06em;white-space:nowrap}
.pbtn.primary{flex:1.35}
.pbtn.primary{background:var(--red);color:#fff}
.pbtn:active{transform:translateY(2px)}

/* 結尾頁 */
.endp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%}
.endp .script{font-family:var(--hand);color:var(--red);-webkit-text-stroke:.6px var(--red);font-size:clamp(38px,11vw,50px);line-height:1;letter-spacing:.2em;margin-bottom:26px}
.endp .verse{color:var(--wine);font-family:var(--hand);-webkit-text-stroke:.6px var(--wine);font-weight:400;font-size:clamp(40px,12vw,54px);letter-spacing:.2em;line-height:1.6;margin:0}
.endp .sign{margin-top:30px;color:#5a3a3a;letter-spacing:.2em;font-size:32px;-webkit-text-stroke:.5px currentColor;font-family:var(--hand)}
.endp .seal{width:56px;height:56px;margin:22px auto 0;border:2px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:26px;transform:rotate(4deg);border-radius:4px;box-shadow:none}

/* 翻頁列 */
.bnav{display:flex;align-items:center;justify-content:space-between;width:min(92vw,470px);gap:10px}
.bnav button{border:0;background:rgba(242,238,232,.12);color:#f3e6e2;border-radius:999px;padding:10px 18px;font-size:30px;font-weight:400;min-width:120px}
.bnav button:disabled{opacity:.3}
.bnav span{color:#e8cfca;font-family:"Helvetica Neue",Arial,sans-serif;font-size:18px;letter-spacing:.2em}
.openBtn{border:0;background:var(--paper);color:var(--red);border-radius:999px;padding:12px 40px;font-size:36px;font-weight:400;letter-spacing:.12em}
.openBtn[hidden],.bnav[hidden]{display:none}

/* 看大圖 */
#lightbox{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(20,4,7,.92);padding:20px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* 吹蠟燭 */
#candle{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(26,4,8,.93);padding:20px}
#candle.on{display:flex}
.cbox{text-align:center;max-width:360px;width:100%}
.cake{position:relative;width:120px;height:230px;margin:0 auto 18px}
.stick{position:absolute;left:38px;bottom:0;width:44px;height:150px;border-radius:8px 8px 4px 4px;
  background:repeating-linear-gradient(135deg,var(--seal-red) 0 14px,var(--paper) 14px 26px)}
.wick{position:absolute;left:58px;bottom:150px;width:4px;height:16px;background:#3a2a20;border-radius:2px}
.flame{position:absolute;left:44px;bottom:160px;width:32px;height:56px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fff8d6 0 20%,var(--gold) 45%,#f07a13 75%,rgba(240,122,19,0) 100%);
  transform-origin:50% 90%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .5s}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.95,1.06) rotate(2deg)}}
.flame.out{opacity:0}
.smoke{position:absolute;left:52px;bottom:170px;width:16px;height:16px;border-radius:50%;background:rgba(220,220,220,.6);opacity:0}
.smoke.go{animation:smoke 1.4s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(3)}}
#candleText{font-size:30px;font-weight:700;line-height:1.5;margin:0 0 14px}
.meter{height:12px;border-radius:6px;background:rgba(247,239,224,.2);overflow:hidden;margin:0 10px 22px}
.meter i{display:block;height:100%;width:0;background:var(--gold);border-radius:6px;transition:width .08s}
.cbox .row{display:flex;gap:12px}
.cbox .row button{flex:1;border:0;border-radius:14px;padding:12px 8px;font-size:30px;font-weight:400}
#candleCancel{background:rgba(247,239,224,.18);color:var(--paper)}
#candleTap{background:var(--paper);color:var(--ink)}

/* 祝福卡 */
#card{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;
  background:rgba(20,6,22,.55);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#card.on{display:flex}
.sheet{width:100%;max-width:460px;background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 22px 18px;animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
.sheet.special{border:4px solid var(--gold);box-shadow:0 0 0 6px rgba(242,198,107,.35),0 0 40px rgba(242,198,107,.5)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:16px}
.seal{flex:none;width:86px;height:86px;border-radius:8px;background-size:cover;background-position:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.sheet.special .seal{box-shadow:0 0 0 4px var(--gold)}
.who p{margin:0;font-size:21px;color:#5a3a3a;font-weight:700}
.who h3{margin:2px 0 0;font-size:58px;font-weight:400;line-height:1.2;font-family:var(--hand);-webkit-text-stroke:.6px currentColor}
.status{display:flex;align-items:center;gap:10px;margin:18px 0 16px;font-size:25px;font-weight:700;min-height:30px}
.wave{display:flex;gap:4px;align-items:flex-end;height:24px}
.wave i{display:block;width:5px;background:var(--seal-red);border-radius:3px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
.status.idle .wave{display:none}
.sheet .row{display:flex;gap:12px}
.sheet .row button{flex:1;border:0;border-radius:14px;padding:12px 10px;font-size:34px;font-weight:400}
.again{background:var(--seal-red);color:#fff}
.close{background:#e8dcc8;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="book" class="screen on">
  <div class="stage">
    <div class="book" id="bookEl">
      <div class="ribbon" aria-hidden="true"></div>

      <article class="page" id="pg1" aria-label="第一頁：那一天">
        <header class="ph"><h2 class="script" id="p1Title"></h2><span class="kicker" id="p1Date"></span></header>
        <div class="collage" id="collage"></div>
        <p class="pnote">點照片可以看大圖</p>
      </article>

      <article class="page" id="pg2" aria-label="第二頁：百壽圖">
        <header class="ph"><h2>二十份祝福</h2></header>
        <div class="board" id="board"><img src="baishou.jpg" alt="百壽圖：二十個不同字體的壽字印章"></div>
        <p class="pnote">點一個壽字，聽聽是誰的祝福</p>
        <div class="pactions">
          <button class="pbtn primary" id="goAR">百壽圖浮起來</button>
          <button class="pbtn" data-candle>吹蠟燭</button>
        </div>
      </article>

      <article class="page" id="pg3" aria-label="最後一頁">
        <div class="endp">
          <div class="script" id="endTop"></div>
          <p class="verse" id="verse"></p>
          <div class="sign" id="sign"></div>
        </div>
      </article>

      <div class="cover" id="cover" role="button" tabindex="0" aria-label="翻開日記">
        <div class="cv-corner" id="cvCorner"></div>
        <div class="cv-script" id="cvScript"></div>
        <div class="cv-frame">
          <svg class="scallop" viewBox="0 0 100 122" preserveAspectRatio="none" aria-hidden="true"><path id="scallopPath" fill="none" stroke="#b3202a" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>
          <div class="cv-photo" id="cvPhoto">外公小時候的照片<br>（cover.jpg）</div>
          <svg class="cv-hat" viewBox="0 0 40 52" aria-hidden="true"><circle cx="20" cy="6" r="5" fill="#b3202a"/><path d="M20 9 L37 50 L3 50 Z" fill="#c62f36"/></svg>
        </div>
        <div class="cv-zh" id="cvZh"></div>
        <div class="cv-foot" id="cvFoot"></div>
        <div class="cover-in">獻給外公</div>
      </div>
    </div>
  </div>
  <button class="openBtn" id="openBook">翻開日記</button>
  <nav class="bnav" id="bnav" hidden>
    <button id="prevPg">‹ 上一頁</button>
    <span id="pageNo"></span>
    <button id="nextPg">下一頁 ›</button>
  </nav>
</section>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="照片"><img id="lbImg" alt=""></div>


<section id="ar" class="screen">
  <div class="bar">
    <button id="arBack">返回</button>
    <span class="right">
      <button id="freeze" hidden>定住畫面</button>
    </span>
  </div>
  <div id="arwrap"></div>
  <div class="frame-guide" id="frameGuide"></div>
  <div class="guide">
    <p id="guide">把手機對準整張百壽圖</p>
    <div class="gbtns">
      <button class="candleBtn" data-candle>🕯️ 吹蠟燭</button>
      <button class="skipBtn" id="skip">畫不在身邊？</button>
    </div>
  </div>
</section>


<div id="candle" role="dialog" aria-modal="true" aria-labelledby="candleText">
  <div class="cbox">
    <div class="cake"><div class="smoke" id="smoke"></div><div class="flame" id="flame"></div><div class="wick"></div><div class="stick"></div></div>
    <p id="candleText">對著手機，吹一口氣</p>
    <div class="meter"><i id="meter"></i></div>
    <div class="row">
      <button id="candleCancel">取消</button>
      <button id="candleTap">幫我吹熄</button>
    </div>
  </div>
</div>

<div id="card" role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="sheet" id="sheet">
    <div class="who">
      <div class="seal" id="cardSeal"></div>
      <div><p id="cardNo"></p><h3 id="cardName"></h3></div>
    </div>
    <div class="status" id="status"><span class="wave"><i></i><i></i><i></i><i></i></span><span id="statusText"></span></div>
    <div class="row">
      <button class="again" id="again">再聽一次</button>
      <button class="close" id="close">關閉</button>
    </div>
  </div>
</div>

<script>
const SPOTS=[[9.03,2.6,15.5,22.64],[25.89,2.6,15.42,22.64],[42.31,2.6,15.56,22.64],[58.42,2.6,16.06,22.64],[75.25,2.6,15.64,22.64],[9.03,26.88,15.5,22.32],[25.89,26.88,15.42,22.32],[42.31,26.88,15.56,22.32],[58.42,26.88,16.06,22.32],[75.25,26.88,15.64,22.32],[9.03,50.44,15.5,22.52],[25.89,50.44,15.42,22.52],[42.31,50.44,15.56,22.52],[58.42,50.44,16.06,22.52],[75.25,50.44,15.64,22.52],[9.03,74.68,15.5,22.48],[25.89,74.68,15.42,22.48],[42.31,74.68,15.56,22.48],[58.42,74.68,16.06,22.48],[75.25,74.68,15.64,22.48]];
const ASPECT=1250/1800;
const pad=n=>String(n).padStart(2,"0");
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= 聲音 ================= */
const player=new Audio(); player.preload="auto"; player.setAttribute("playsinline","");
let current=null;
const FOUND={}; let scanDone=false;
(async function scanAudio(){
  const exts=["mp3","m4a","wav","aac"];
  await Promise.all(BLESSINGS.map(async b=>{
    for(const e of exts){
      const url=pad(b.no)+"."+e;
      try{ const r=await fetch(url,{method:"HEAD",cache:"no-store"}); if(r.ok){ FOUND[b.no]=url; return; } }catch(err){}
    }
  }));
  scanDone=true;
})();
function unlockAudio(){
  try{
    player.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    const p=player.play(); if(p) p.catch(()=>{});
  }catch(e){}
}
function playNo(no){
  const url=FOUND[no];
  if(!url){
    if(scanDone){ setStatus("missing"); return; }
    setStatus("loading");
    setTimeout(()=>{ if(current===no) setStatus(FOUND[no]?"tap":"missing"); },2500);
    return;
  }
  player.onended=()=>setStatus("done");
  player.onerror=()=>setStatus("broken");
  player.src=url; setStatus("loading");
  const p=player.play();
  if(p) p.then(()=>setStatus("playing")).catch(e=>setStatus(e.name==="NotAllowedError"?"tap":"broken"));
}
function setStatus(s){
  $("status").classList.toggle("idle", s!=="playing");
  $("statusText").textContent={loading:"準備播放…",playing:"正在播放",done:"播放完畢",missing:"這段錄音還沒放進來",tap:"請按「再聽一次」",broken:"這段錄音打不開，請換成 m4a 或 mp3 檔"}[s]||"";
}

/* ================= 祝福卡 ================= */
function openCard(no){
  const b=BLESSINGS.find(x=>x.no===no)||{name:""};
  current=no;
  $("sheet").classList.toggle("special",!!b.special);
  $("cardSeal").style.backgroundImage="url("+pad(no)+".jpg)";
  $("cardNo").textContent=b.special?"外公想對大家說":"第 "+no+" 個壽字";
  $("cardName").textContent=b.name;
  $("card").classList.add("on");
  playNo(no);
}
function closeCard(){
  $("card").classList.remove("on"); player.pause();
  document.querySelectorAll(".spot.lit,.spot.glow").forEach(x=>x.classList.remove("lit","glow"));
  $("board").classList.remove("dim");
  resetTiles(); current=null;
}
$("again").onclick=()=>{ if(current) playNo(current); };
$("close").onclick=closeCard;
$("card").addEventListener("click",e=>{ if(e.target.id==="card") closeCard(); });

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }

/* ================= 直接點選 ================= */
const spots=[];
SPOTS.forEach((p,i)=>{
  const b=document.createElement("button"); b.className="spot";
  b.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%`;
  b.setAttribute("aria-label","第 "+(i+1)+" 個壽字："+(BLESSINGS[i]?.name||""));
  b.onclick=()=>{ closeCard(); b.classList.add("lit"); openCard(i+1); };
  $("board").appendChild(b); spots.push(b);
});

/* ================= 吹蠟燭 ================= */
let mic=null, blowing=false;
document.querySelectorAll("[data-candle]").forEach(b=>b.onclick=openCandle);
function openCandle(){
  unlockAudio(); closeCard();
  $("flame").classList.remove("out"); $("smoke").classList.remove("go");
  $("candleText").textContent="對著手機，吹一口氣"; $("meter").style.width="0";
  $("candle").classList.add("on"); blowing=true;
  startMic();
}
async function startMic(){
  let ctx;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    setSession("play-and-record");   // 要錄音前先切到可錄音的模式，第二次吹才不會失敗
    ctx=new AC(); ctx.resume&&ctx.resume();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!blowing){ stream.getTracks().forEach(t=>t.stop()); ctx.close(); return; }
    const src=ctx.createMediaStreamSource(stream), an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
    mic={stream,ctx};
    const buf=new Float32Array(an.fftSize);
    let t0=performance.now(), last=t0, base=0, n=0, acc=0;
    const loop=now=>{
      if(!blowing||!mic) return;
      an.getFloatTimeDomainData(buf);
      let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
      const rms=Math.sqrt(s/buf.length), dt=(now-last)/1000; last=now;
      if(now-t0<600){ base+=rms; n++; }               // 先聽一下環境音
      const th=Math.min(0.2,Math.max(0.06,(n?base/n:0)*3));
      $("meter").style.width=Math.min(100,rms/th*70)+"%";
      $("flame").style.transform=`scale(${Math.max(.6,1-rms/th*.3)},1) skewX(${Math.min(25,rms/th*12)}deg)`;
      if(now-t0>600){ acc = rms>th ? acc+dt : Math.max(0,acc-dt*2); }
      if(acc>0.3){ blownOut(); return; }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }catch(e){
    try{ ctx&&ctx.close(); }catch(_){}
    if(blowing) $("candleText").textContent="麥克風沒有打開，請按「幫我吹熄」";
  }
}
function setSession(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }
function stopMic(){
  if(mic){ try{ mic.stream.getTracks().forEach(t=>t.stop()); mic.ctx.close(); }catch(e){} mic=null; }
  setSession("playback");   // 錄完切回播放，聲音才會從喇叭大聲出來
}
async function blownOut(){
  if(!blowing) return; blowing=false; stopMic();
  $("flame").style.transform=""; $("flame").classList.add("out"); $("smoke").classList.add("go");
  $("candleText").textContent="生日快樂！"; $("meter").style.width="100%";
  await sleep(1100);
  $("candle").classList.remove("on");
  await lightAll();
  openCard(CANDLE_FINALE);
}
$("candleTap").onclick=()=>{ unlockAudio(); blownOut(); };
$("candleCancel").onclick=()=>{ blowing=false; stopMic(); $("candle").classList.remove("on"); };

/* ================= AR：認出百壽圖 → 浮起來 → 飄在房間裡 ================= */
let mode=null, sceneEl=null, arSys=null, found=false, frozen=false, risen=false;
let phase=null, stableTimer=null, motionOK=true, bobBase=null, bobAmp=0, baseScale=1, zoom=1, pinch=null, lastPinch=0;
const AR_READY=!!(window.AFRAME && AFRAME.components && AFRAME.components["mindar-image"]);
const THREE_=AR_READY?AFRAME.THREE:null;

function posOf(i,z){
  const p=SPOTS[i], cx=(p[0]+p[2]/2)/100, cy=(p[1]+p[3]/2)/100;
  return `${(cx-0.5).toFixed(4)} ${((0.5-cy)*ASPECT).toFixed(4)} ${z}`;
}
function restZ(){ return risen?0.035:0.001; }
function resetTiles(){
  if(!sceneEl) return;
  sceneEl.querySelectorAll("[shou-tile]").forEach((el,i)=>{
    el.setAttribute("animation__pick",{property:"position",to:posOf(i,restZ()),dur:300});
    el.setAttribute("animation__big",{property:"scale",to:"1 1 1",dur:300});
    el.setAttribute("animation__col",{property:"material.color",type:"color",to:"#ffffff",dur:300});
    const g=el.querySelector(".glowp"); g&&g.setAttribute("animation__glow",{property:"material.opacity",to:0,dur:300});
  });
}
function riseAll(){
  if(risen||!sceneEl) return; risen=true;
  sceneEl.querySelectorAll("[shou-tile]").forEach((el,i)=>{
    el.setAttribute("animation__rise",{property:"position",from:posOf(i,0.001),to:posOf(i,0.035),dur:600,delay:i*60,easing:"easeOutBack"});
    el.setAttribute("animation__fade",{property:"material.opacity",from:0,to:1,dur:400,delay:i*60});
  });
}

if(AR_READY){
  AFRAME.registerComponent("shou-tile",{
    schema:{no:{type:"int"}},
    init(){
      this.el.addEventListener("click",()=>{
        if(phase==="lifting") return;
        if(performance.now()-lastPinch<500) return;
        if(phase==="scan" && !found) return;
        if($("candle").classList.contains("on")) return;
        closeCard();
        this.el.setAttribute("animation__pick",{property:"position",to:posOf(this.data.no-1,0.14),dur:350,easing:"easeOutBack"});
        this.el.setAttribute("animation__big",{property:"scale",to:"1.3 1.3 1",dur:350,easing:"easeOutBack"});
        openCard(this.data.no);
      });
    }
  });
  // 用手機的方向感應轉動相機：以「浮起來那一刻」為基準
  AFRAME.registerComponent("gyro-delta",{
    init(){
      const T=THREE_;
      this.on=false; this.ori=null; this.q0=null;
      this.qd=new T.Quaternion(); this.qz=new T.Quaternion(); this.e=new T.Euler();
      this.q1=new T.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)); this.zee=new T.Vector3(0,0,1);
      this.onOri=e=>{ if(e.alpha==null && e.beta==null) return; this.ori={a:e.alpha||0,b:e.beta||0,g:e.gamma||0}; };
      window.addEventListener("deviceorientation",this.onOri);
    },
    remove(){ window.removeEventListener("deviceorientation",this.onOri); },
    start(){ this.on=true; this.q0=null; },
    recenter(){ this.q0=null; },
    tick(){
      if(!this.on||!this.ori) return;
      const d=Math.PI/180, o=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
      this.e.set(this.ori.b*d, this.ori.a*d, -this.ori.g*d, "YXZ");
      this.qd.setFromEuler(this.e).multiply(this.q1).multiply(this.qz.setFromAxisAngle(this.zee,-o*d));
      if(!this.q0) this.q0=this.qd.clone();
      this.el.object3D.quaternion.copy(this.q0.clone().invert().multiply(this.qd));
    }
  });
}

function tilesMarkup(){
  return SPOTS.map((p,i)=>{
    const tw=p[2]/100, th=(p[3]/100)*ASPECT;
    return `<a-plane class="clickable" shou-tile="no:${i+1}" position="${posOf(i,0.001)}" width="${tw.toFixed(4)}" height="${th.toFixed(4)}"
      material="src:#t${i+1}; transparent:true; opacity:0; shader:flat">
      <a-plane class="glowp" position="0 0 -0.002" width="${(tw*1.05).toFixed(4)}" height="${(th*1.05).toFixed(4)}" material="color:#f2c66b; shader:flat; transparent:true; opacity:0"></a-plane>
    </a-plane>`;
  }).join("");
}
function setGuide(t){ $("guide").textContent=t; }

function startAR(){
  mode="ar"; phase="scan"; show("ar");
  found=false; frozen=false; risen=false; bobBase=null;
  $("freeze").hidden=true; $("skip").hidden=false;
  $("freeze").classList.remove("frozen"); $("freeze").textContent="定住畫面";
  $("frameGuide").style.display="block"; setGuide("開啟相機中…");
  $("arwrap").innerHTML=`<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
      color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets><img id="artimg" src="baishou.jpg">${SPOTS.map((_,i)=>`<img id="t${i+1}" src="${pad(i+1)}.jpg">`).join("")}</a-assets>
    <a-camera id="cam" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false" gyro-delta
      cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 1000000; objects: .clickable"></a-camera>
    <a-entity id="anchor" mindar-image-target="targetIndex: 0">
      <a-entity id="lifter">
        <a-plane id="shadow" position="0.03 -0.04 -0.03" width="1.02" height="${(ASPECT+0.02).toFixed(4)}" material="color:#000; shader:flat; transparent:true; opacity:0"></a-plane>
        <a-plane id="artp" width="1" height="${ASPECT.toFixed(4)}" material="src:#artimg; shader:flat; transparent:true; opacity:0"></a-plane>
        ${tilesMarkup()}
      </a-entity>
    </a-entity>
    <a-entity id="floater"></a-entity>
  </a-scene>`;
  sceneEl=$("arwrap").querySelector("a-scene");
  const anchor=sceneEl.querySelector("#anchor");
  anchor.addEventListener("targetFound",()=>{
    if(phase!=="scan") return;
    found=true; $("frameGuide").style.display="none"; setGuide("找到了！拿穩一下…"); riseAll();
    clearTimeout(stableTimer); stableTimer=setTimeout(()=>{ if(found&&phase==="scan") liftOff(true); },1300);
  });
  anchor.addEventListener("targetLost",()=>{
    if(phase!=="scan") return;
    found=false; clearTimeout(stableTimer); setGuide("把手機對準整張百壽圖");
  });
  sceneEl.addEventListener("arError",()=>setGuide("相機打不開，可以按「畫不在身邊？」，或改用「直接點壽字聽」。"));
  const go=()=>{ arSys=sceneEl.systems["mindar-image-system"]; arSys.start(); if(phase==="scan") setGuide("把手機對準整張百壽圖"); };
  sceneEl.hasLoaded?go():sceneEl.addEventListener("loaded",go);
}

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tween(dur,fn){ return new Promise(res=>{ const t0=performance.now(); const f=now=>{ const k=Math.min(1,(now-t0)/dur); fn(ease(k)); k<1?requestAnimationFrame(f):res(); }; requestAnimationFrame(f); }); }
function fadeEl(id,to,dur){ const el=sceneEl&&sceneEl.querySelector("#"+id); el&&el.setAttribute("animation__f",{property:"material.opacity",to,dur}); }

async function liftOff(fromMarker){
  if(phase!=="scan"||!sceneEl) return;
  phase="lifting"; clearTimeout(stableTimer);
  $("skip").hidden=true; $("frameGuide").style.display="none";
  try{ arSys&&arSys.pause(true); }catch(e){}           // 停止辨識，但相機畫面繼續
  const T=THREE_, lifterEl=sceneEl.querySelector("#lifter"), lifter=lifterEl.object3D;
  const floater=sceneEl.querySelector("#floater").object3D, cam=sceneEl.camera;
  cam.updateProjectionMatrix();
  const tan=Math.tan(cam.fov*Math.PI/360), asp=cam.aspect||1;
  const fitD=s=>Math.max(s/(0.86*2*tan*asp), s*ASPECT/(0.6*2*tan));
  if(fromMarker){
    sceneEl.object3D.updateMatrixWorld(true);
    floater.attach(lifter);                            // 從實體畫的位置「拿起來」
  }else{
    floater.add(lifter);
    const s=1000, d=fitD(s);
    lifter.position.set(0,0,-d*1.6); lifter.quaternion.identity(); lifter.scale.setScalar(s);
    riseAll();
  }
  const p0=lifter.position.clone(), q0=lifter.quaternion.clone(), s0=lifter.scale.x;
  const d=fitD(s0), visH=2*d*tan;
  const p1=new T.Vector3(0,visH*0.07,-d), q1=new T.Quaternion();
  setGuide(fromMarker?"百壽圖浮起來了！":"百壽圖來了！");
  fadeEl("artp",1,600); fadeEl("shadow",0.35,900);
  await new Promise(r=>setTimeout(r,fromMarker?650:150));
  if(!sceneEl) return;
  await tween(fromMarker?1700:1100,k=>{
    lifter.position.lerpVectors(p0,p1,k);
    lifter.quaternion.slerpQuaternions(q0,q1,k);
  });
  if(!sceneEl) return;
  bobBase=p1.clone(); bobAmp=visH*0.008; baseScale=s0; zoom=1;
  phase="float";
  sceneEl.querySelector("#cam").components["gyro-delta"].start();
  $("freeze").hidden=false;
  setGuide("點壽字聽祝福，兩指可放大縮小");
  const cam3=sceneEl.querySelector("#cam").object3D;
  let last=performance.now();
  const loop=now=>{
    if(!sceneEl||phase!=="float") return;
    const dt=Math.min(0.1,(now-last)/1000); last=now;
    if(!frozen) lifter.position.y=bobBase.y+Math.sin(now/900)*bobAmp;
    floater.quaternion.slerp(cam3.quaternion, 1-Math.exp(-dt*3));   // 慢慢跟上手機畫面
    lifter.scale.setScalar(baseScale*zoom);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

$("skip").onclick=()=>liftOff(false);

async function lightAll(){   // 二十個壽字依序亮起
  const gap=150;
  if(mode==="flat"){
    $("board").classList.add("dim"); await sleep(500);
    spots.forEach((s,i)=>setTimeout(()=>s.classList.add("glow"),i*gap));
  }else if(sceneEl){
    if(phase==="scan") await liftOff(false).catch(()=>{});
    const tiles=[...sceneEl.querySelectorAll("[shou-tile]")];
    tiles.forEach(el=>{ el.setAttribute("material","opacity",1); el.setAttribute("animation__col",{property:"material.color",type:"color",to:"#3a3a3a",dur:400}); });
    await sleep(500);
    tiles.forEach((el,i)=>setTimeout(()=>{
      el.setAttribute("animation__col",{property:"material.color",type:"color",to:"#ffffff",dur:300});
      el.setAttribute("animation__pick",{property:"position",to:posOf(i,0.07),dur:350,easing:"easeOutBack"});
      const g=el.querySelector(".glowp"); g&&g.setAttribute("animation__glow",{property:"material.opacity",to:0.95,dur:300});
    },i*gap));
  }
  await sleep(SPOTS.length*gap+700);
}

/* ================= 共用按鈕 ================= */
$("goAR").onclick=()=>{
  unlockAudio();
  if(!AR_READY){ alert("AR 程式沒有載入成功，請先用「直接點壽字聽」。"); return; }
  motionOK=true;
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(r=>{ motionOK=(r==="granted"); }).catch(()=>{ motionOK=false; });
  }
  try{ startAR(); }catch(e){ setGuide("AR 啟動失敗："+e.message); }
};
function stopAR(){
  closeCard(); blowing=false; stopMic(); $("candle").classList.remove("on");
  clearTimeout(stableTimer);
  try{ arSys&&arSys.stop(); }catch(e){}
  arSys=null; sceneEl=null; phase=null; $("arwrap").innerHTML=""; mode=null;
}
$("arBack").onclick=()=>{ stopAR(); mode="flat"; show("book"); };
/* 兩指縮放 */
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
$("ar").addEventListener("touchstart",e=>{
  if(phase!=="float"||e.touches.length!==2) return;
  pinch={d:tdist(e.touches),z:zoom}; lastPinch=performance.now();
},{passive:true});
$("ar").addEventListener("touchmove",e=>{
  if(!pinch||e.touches.length!==2) return;
  e.preventDefault();
  zoom=Math.min(2.2,Math.max(0.5,pinch.z*tdist(e.touches)/pinch.d)); lastPinch=performance.now();
},{passive:false});
$("ar").addEventListener("touchend",e=>{ if(e.touches.length<2){ if(pinch) lastPinch=performance.now(); pinch=null; } },{passive:true});
document.addEventListener("gesturestart",e=>{ if(mode==="ar") e.preventDefault(); });
$("freeze").onclick=()=>{
  if(phase!=="float"||!sceneEl) return;
  frozen=!frozen;
  const g=sceneEl.querySelector("#cam").components["gyro-delta"];
  if(frozen){ g.on=false; arSys&&arSys.video&&arSys.video.pause(); }
  else{ g.on=true; arSys&&arSys.video&&arSys.video.play().catch(()=>{}); }
  $("freeze").textContent=frozen?"恢復鏡頭":"定住畫面";
  $("freeze").classList.toggle("frozen",frozen);
  setGuide(frozen?"畫面已定住，可以放心慢慢點":"點壽字聽祝福，兩指可放大縮小");
};
/* ================= 貼紙（照片頁裝飾） ================= */
function stkImg(src,css){ const e=document.createElement("img"); e.src=src; e.alt=""; e.className="stk"; Object.assign(e.style,css); return e; }
function decorateCollage(box){
  const items=[...box.children];
  const plan={
    0:it=>it.append(stkImg("stk_shou.png",{width:"46px",right:"-8px",bottom:"-14px",transform:"rotate(8deg)"})),
    3:it=>it.append(stkImg("stk_tiger.png",{width:"50px",left:"-10px",top:"-16px",transform:"rotate(-7deg)"})),
    6:it=>it.append(stkImg("stk_peach.png",{width:"58px",right:"-10px",bottom:"-16px",transform:"rotate(-4deg)"})),

}

(function(){
  const B=BOOK;
  $("cvScript").textContent=B.coverNumber;
  $("cvZh").innerHTML=B.coverTitle.split("\n").join("<br>");
  $("cvCorner").innerHTML=B.coverCorner.join("<br>");
  $("cvFoot").textContent=B.coverFoot;
  $("p1Title").textContent=B.page1Title;
  $("p1Date").textContent=B.page1Date;
  $("verse").innerHTML=B.endVerse.split("\n").join("<br>");
  $("sign").textContent=B.endSign;
  $("endTop").textContent=B.endTop;
  // 花邊外框
  const W=100,H=122,r=3.2,m=r;
  const edge=(len)=>{ const n=Math.max(2,Math.round(len/(2*r))); return {n,s:len/n}; };
  let d=`M${m} ${m}`; let e;
  e=edge(W-2*m); for(let i=0;i<e.n;i++) d+=` a${e.s/2} ${e.s/2} 0 0 1 ${e.s} 0`;
  e=edge(H-2*m); for(let i=0;i<e.n;i++) d+=` a${e.s/2} ${e.s/2} 0 0 1 0 ${e.s}`;
  e=edge(W-2*m); for(let i=0;i<e.n;i++) d+=` a${e.s/2} ${e.s/2} 0 0 1 ${-e.s} 0`;
  e=edge(H-2*m); for(let i=0;i<e.n;i++) d+=` a${e.s/2} ${e.s/2} 0 0 1 0 ${-e.s}`;
  $("scallopPath").setAttribute("d",d);
  // 封面照片
  const tryImg=(names)=>new Promise(res=>{ let i=0; const next=()=>{ if(i>=names.length) return res(null); const im=new Image(); const n=names[i++]; im.onload=()=>res(n); im.onerror=next; im.src=n; }; next(); });
  tryImg(["cover.jpg","cover.jpeg","cover.png","cover.JPG"]).then(n=>{ if(n){ $("cvPhoto").style.backgroundImage=`url("${n}")`; $("cvPhoto").classList.add("has"); } });
  // 照片拼貼：photo1.jpg ~ photo12.jpg
  (async()=>{
    const found=[];
    for(let k=1;k<=12;k++){ const n=await tryImg([`photo${k}.jpg`,`photo${k}.jpeg`,`photo${k}.png`,`photo${k}.JPG`]); if(n) found.push(n); else if(k>found.length+2) break; }
    const box=$("collage"); box.innerHTML="";
    if(!found.length){
      for(let k=1;k<=4;k++){ const f=document.createElement("div"); f.className="ph-item empty"; f.innerHTML=`<div class="img">壽宴當天的照片<br>photo${k}.jpg</div>`; box.appendChild(f); }
      decorateCollage(box); return;
    }
    found.forEach(n=>{
      const f=document.createElement("button"); f.className="ph-item"; f.setAttribute("aria-label","看大圖");
      f.innerHTML=`<div class="img" style="background-image:url('${n}')"></div>`;
      f.onclick=()=>{ $("lbImg").src=n; $("lightbox").classList.add("on"); };
      box.appendChild(f);
    });
    decorateCollage(box);
  })();
  $("lightbox").onclick=()=>$("lightbox").classList.remove("on");
})();

const pages=[$("pg1"),$("pg2"),$("pg3")];
let pageIdx=-1;   // -1 = 封面
pages.forEach((p,i)=>p.style.zIndex=40-i);
function renderNav(){
  const open=pageIdx>=0;
  $("openBook").hidden=open; $("bnav").hidden=!open;
  $("pageNo").textContent=open?`${pageIdx+1} / ${pages.length}`:"";
  $("nextPg").disabled=pageIdx>=pages.length-1;
  $("prevPg").textContent=pageIdx===0?"‹ 封面":"‹ 上一頁";
}
function turn(el,on){
  if(on){ el.classList.remove("gone"); requestAnimationFrame(()=>el.classList.add("turned")); setTimeout(()=>{ if(el.classList.contains("turned")) el.classList.add("gone"); },900); }
  else{ el.classList.remove("gone"); requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("turned"))); }
}
function goPage(n){
  closeCard();
  n=Math.max(-1,Math.min(pages.length-1,n));
  if(n===pageIdx) return;
  if(n>pageIdx){ for(let i=pageIdx;i<n;i++) turn(i<0?$("cover"):pages[i],true); }
  else{ for(let i=pageIdx-1;i>=n;i--) turn(i<0?$("cover"):pages[i],false); }
  pageIdx=n; renderNav();
}
const openIt=()=>{ unlockAudio(); goPage(0); };
$("cover").onclick=openIt;
$("cover").onkeydown=e=>{ if(e.key==="Enter"||e.key===" ") openIt(); };
$("openBook").onclick=openIt;
$("nextPg").onclick=()=>goPage(pageIdx+1);
$("prevPg").onclick=()=>goPage(pageIdx-1);
// 左右滑動翻頁
let sx=null, sy=null;
$("bookEl").addEventListener("touchstart",e=>{ if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
$("bookEl").addEventListener("touchend",e=>{
  if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?goPage(pageIdx+1):goPage(pageIdx-1); }
},{passive:true});
renderNav();
mode="flat";
</script>
